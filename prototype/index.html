<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RideGlobal - Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background:#0a0a12; font-family: sans-serif; }
  #hud {
    position: absolute; top: 12px; left: 12px; color: #fff;
    background: rgba(0,0,0,0.4); padding: 10px 14px; border-radius: 8px;
    font-size: 14px; line-height: 1.4; z-index: 10; min-width: 240px;
  }
  #hud b { color: #4fd1ff; }
  #trickPop {
    position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%);
    color: #ffe14f; font-size: 26px; font-weight: bold; text-shadow: 0 0 8px #000;
    z-index: 15; display: none; pointer-events: none;
  }
  #leaderboard {
    position: absolute; top: 12px; right: 12px; color: #fff;
    background: rgba(0,0,0,0.5); padding: 10px 14px; border-radius: 8px;
    font-size: 13px; line-height: 1.5; z-index: 10; min-width: 220px;
  }
  #leaderboard h3 { margin: 0 0 6px; color: #ffcc00; font-size: 14px; }
  #finishOverlay {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85); color: #fff; padding: 20px 28px; border-radius: 12px;
    font-size: 18px; z-index: 20; display: none; text-align: center;
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="hud">
  <div><b>RideGlobal</b> — vertical slice prototype</div>
  <div>Move: W A S D or Arrow keys</div>
  <div>Jump: Space · Spin trick: Q / E (while airborne)</div>
  <div id="speed">Speed: 0</div>
  <div id="timer">Time: 0.0s</div>
  <div id="trickScore">Trick score: 0</div>
</div>
<div id="trickPop"></div>
<div id="leaderboard">
  <h3>Global Leaderboard</h3>
  <div id="lbList">Loading...</div>
</div>
<div id="finishOverlay"></div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
// --- Supabase config (RideGlobal prototype leaderboard) ---
const SUPABASE_URL = "https://frqhtntzwwzcrcyewtxi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZycWh0bnR6d3d6Y3JjeWV3dHhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NjI1OTUsImV4cCI6MjEwMTIzODU5NX0.6zu-nlAg_2taH58z2TlXe7tDP3Uoartlrt6Il-sdtEc";

async function sbFetch(path, options = {}) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
    ...options,
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json",
      "Prefer": options.prefer || "return=representation",
      ...(options.headers || {})
    }
  });
  return res.json();
}

async function loadLeaderboard() {
  try {
    const rows = await sbFetch(
      "rideglobal_runs?select=time_ms,trick_score,track_id,rideglobal_players(display_name)&order=time_ms.asc&limit=10"
    );
    const list = document.getElementById('lbList');
    if (!Array.isArray(rows) || rows.length === 0) {
      list.innerHTML = "No runs yet — be the first!";
      return;
    }
    list.innerHTML = rows.map((r, i) => {
      const name = (r.rideglobal_players && r.rideglobal_players.display_name) || "Anonymous";
      return (i + 1) + ". " + name + " — " + (r.time_ms / 1000).toFixed(2) + "s (" + (r.trick_score || 0) + " pts)";
    }).join("<br/>");
  } catch (e) {
    document.getElementById('lbList').innerHTML = "Leaderboard unavailable";
  }
}
loadLeaderboard();

async function findOrCreatePlayer(name) {
  const existing = await sbFetch("rideglobal_players?display_name=eq." + encodeURIComponent(name) + "&limit=1");
  if (Array.isArray(existing) && existing.length > 0) {
    return existing[0].id;
  }
  const created = await sbFetch("rideglobal_players", {
    method: "POST",
    body: JSON.stringify({ display_name: name })
  });
  return Array.isArray(created) && created[0] ? created[0].id : null;
}

async function submitScore(timeMs, trickScore) {
  const stored = localStorage.getItem("rideglobal_name");
  const name = prompt("Finish! Enter your rider name for the global leaderboard:", stored || "Rider");
  if (!name) return;
  localStorage.setItem("rideglobal_name", name);
  try {
    const playerId = await findOrCreatePlayer(name);
    await sbFetch("rideglobal_runs", {
      method: "POST",
      body: JSON.stringify({ player_id: playerId, track_id: "prototype-track-1", time_ms: Math.round(timeMs), trick_score: trickScore })
    });
    loadLeaderboard();
  } catch (e) {
    console.error("Score submit failed", e);
  }
}

// --- Basic scene setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 30, 140);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Lighting ---
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(40, 60, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

// --- Ground / track ---
const groundGeo = new THREE.PlaneGeometry(400, 400);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a5f3a });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Checkpoints + finish line
const NUM_CHECKPOINTS = 10;
const CHECKPOINT_SPACING = 18;
const START_Z = 10;
const checkpointGeo = new THREE.TorusGeometry(2.2, 0.15, 8, 24);
const checkpointMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0x442200 });
const finishMat = new THREE.MeshStandardMaterial({ color: 0x33ff66, emissive: 0x114422 });
const checkpoints = [];
let finishZ = 0;
for (let i = 0; i < NUM_CHECKPOINTS; i++) {
  const isFinish = i === NUM_CHECKPOINTS - 1;
  const cp = new THREE.Mesh(checkpointGeo, isFinish ? finishMat : checkpointMat);
  const z = -i * CHECKPOINT_SPACING - 15;
  cp.position.set(0, 2.2, z);
  cp.rotation.y = Math.PI / 2;
  scene.add(cp);
  checkpoints.push({ mesh: cp, z, isFinish });
  if (isFinish) finishZ = z;
}

const RAMP_Z_LIST = [];
function addRamp(z) {
  const rampGeo = new THREE.BoxGeometry(6, 0.6, 6);
  const rampMat = new THREE.MeshStandardMaterial({ color: 0x8899aa });
  const ramp = new THREE.Mesh(rampGeo, rampMat);
  const x = (Math.random() - 0.5) * 4;
  ramp.position.set(x, 0.3, z);
  ramp.rotation.x = -0.35;
  ramp.castShadow = true;
  ramp.receiveShadow = true;
  scene.add(ramp);
  RAMP_Z_LIST.push(z);
}
for (let i = 0; i < 6; i++) addRamp(-30 - i * 25);

// --- Skate zone: a quarter-pipe transition proving the "multi-discipline world" idea ---
const SKATE_ZONE_Z = -195; // placed just before the finish line
const skateGroup = new THREE.Group();
const qpMat = new THREE.MeshStandardMaterial({ color: 0xff8800 });
const qpGeo = new THREE.CylinderGeometry(6, 6, 10, 24, 1, false, 0, Math.PI / 2);
const quarterPipe = new THREE.Mesh(qpGeo, qpMat);
quarterPipe.rotation.z = Math.PI / 2;
quarterPipe.rotation.y = Math.PI / 2;
quarterPipe.position.set(0, 0, SKATE_ZONE_Z);
quarterPipe.castShadow = true;
quarterPipe.receiveShadow = true;
skateGroup.add(quarterPipe);

const skateFloorGeo = new THREE.PlaneGeometry(16, 20);
const skateFloorMat = new THREE.MeshStandardMaterial({ color: 0x554433 });
const skateFloor = new THREE.Mesh(skateFloorGeo, skateFloorMat);
skateFloor.rotation.x = -Math.PI / 2;
skateFloor.position.set(0, 0.01, SKATE_ZONE_Z);
skateFloor.receiveShadow = true;
skateGroup.add(skateFloor);
scene.add(skateGroup);
const SKATE_ZONE_HALF_DEPTH = 8;
let inSkateBoost = false;

// Grind rail: offset to one side of the main line, rewards steering onto it
const RAIL_X = 3.2;
const RAIL_Z_START = -60;
const RAIL_Z_END = -110;
const RAIL_Y = 0.9;
const railMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.6, roughness: 0.3 });
const railGeo = new THREE.CylinderGeometry(0.08, 0.08, Math.abs(RAIL_Z_START - RAIL_Z_END), 8);
const rail = new THREE.Mesh(railGeo, railMat);
rail.rotation.x = Math.PI / 2;
rail.position.set(RAIL_X, RAIL_Y, (RAIL_Z_START + RAIL_Z_END) / 2);
rail.castShadow = true;
scene.add(rail);
// Support posts
for (let i = 0; i <= 4; i++) {
  const postZ = RAIL_Z_START + (RAIL_Z_END - RAIL_Z_START) * (i / 4);
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, RAIL_Y, 6), railMat);
  post.position.set(RAIL_X, RAIL_Y / 2, postZ);
  scene.add(post);
}
let isGrinding = false;
let grindScoreTimer = 0;

// --- Rider: low-poly BMX rider + bike stand-in ---
const rider = new THREE.Group();

const frameMat = new THREE.MeshStandardMaterial({ color: 0x2266ee });
const mainFrame = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 1.9), frameMat);
mainFrame.position.set(0, 0.55, 0);
mainFrame.castShadow = true;
rider.add(mainFrame);

const diagFrame = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 1.1), frameMat);
diagFrame.position.set(0, 0.78, -0.35);
diagFrame.rotation.x = 0.9;
diagFrame.castShadow = true;
rider.add(diagFrame);

const handlebar = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.1, 0.1), new THREE.MeshStandardMaterial({ color: 0x111111 }));
handlebar.position.set(0, 1.05, 0.85);
rider.add(handlebar);

const bodyGeo = new THREE.BoxGeometry(0.9, 1.1, 0.7);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff4d4d });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.set(0, 1.35, -0.1);
body.castShadow = true;
rider.add(body);

const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffcc99 }));
head.position.set(0, 2.05, -0.05);
head.castShadow = true;
rider.add(head);

const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.12, 20);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
const hubMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
[[0, 0.5, 0.95], [0, 0.5, -0.95]].forEach(([x, y, z]) => {
  const wheel = new THREE.Mesh(wheelGeo, wheelMat);
  wheel.rotation.z = Math.PI / 2;
  wheel.position.set(x, y, z);
  wheel.castShadow = true;
  rider.add(wheel);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.16, 8), hubMat);
  hub.rotation.z = Math.PI / 2;
  hub.position.set(x, y, z);
  rider.add(hub);
});

rider.position.set(0, 0, START_Z);
scene.add(rider);

// --- Movement + trick state ---
const state = {
  velocityZ: 0, velocityY: 0, onGround: true, yaw: 0,
  raceStarted: false, raceFinished: false, startTime: 0,
  trickScore: 0, spinAccum: 0, airSpins: 0
};
const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

const ACCEL = 22, MAX_SPEED = 26, TURN_SPEED = 2.4, GRAVITY = -30, JUMP_FORCE = 11, FRICTION = 0.985;
const SPIN_RATE = 6.5; // radians/sec while holding Q/E in air
const clock = new THREE.Clock();
const speedEl = document.getElementById('speed');
const timerEl = document.getElementById('timer');
const trickScoreEl = document.getElementById('trickScore');
const trickPopEl = document.getElementById('trickPop');
const finishOverlay = document.getElementById('finishOverlay');

function popTrickText(text) {
  trickPopEl.textContent = text;
  trickPopEl.style.display = 'block';
  clearTimeout(trickPopEl._t);
  trickPopEl._t = setTimeout(() => trickPopEl.style.display = 'none', 900);
}

function update(dt) {
  const forward = (keys['w'] || keys['arrowup']) ? 1 : (keys['s'] || keys['arrowdown']) ? -1 : 0;
  const turn = (keys['a'] || keys['arrowleft']) ? 1 : (keys['d'] || keys['arrowright']) ? -1 : 0;
  const spinInput = keys['q'] ? -1 : keys['e'] ? 1 : 0;

  if (!state.raceFinished) {
    if (forward !== 0 && !state.raceStarted) {
      state.raceStarted = true;
      state.startTime = performance.now();
    }
    state.yaw += turn * TURN_SPEED * dt * (state.velocityZ !== 0 ? 1 : 0.4);

    const forwardVec = new THREE.Vector3(Math.sin(state.yaw), 0, Math.cos(state.yaw));
    const targetSpeed = forward * MAX_SPEED;
    state.velocityZ += (targetSpeed - state.velocityZ) * Math.min(1, ACCEL * dt / MAX_SPEED);
    state.velocityZ *= FRICTION;
    rider.position.addScaledVector(forwardVec, -state.velocityZ * dt);

    const wasOnGround = state.onGround;
    if (state.onGround && keys[' ']) {
      state.velocityY = JUMP_FORCE;
      state.onGround = false;
      state.spinAccum = 0;
    }
    state.velocityY += GRAVITY * dt;
    rider.position.y += state.velocityY * dt;

    // Skate zone: riding into the quarter-pipe while on ground launches you into a vert air
    const distToSkate = Math.abs(rider.position.z - SKATE_ZONE_Z);
    if (state.onGround && distToSkate < SKATE_ZONE_HALF_DEPTH && Math.abs(state.velocityZ) > 8 && !inSkateBoost) {
      inSkateBoost = true;
      state.velocityY = JUMP_FORCE * 1.6;
      state.onGround = false;
      state.spinAccum = 0;
      popTrickText("VERT AIR!");
    }
    if (distToSkate > SKATE_ZONE_HALF_DEPTH + 4) inSkateBoost = false;

    // Grind rail: snap onto the rail when close, in air, and moving fast enough
    const withinRailZ = rider.position.z <= RAIL_Z_START && rider.position.z >= RAIL_Z_END;
    const nearRailX = Math.abs(rider.position.x - RAIL_X) < 0.6;
    const nearRailY = rider.position.y > RAIL_Y - 0.7 && rider.position.y < RAIL_Y + 1.4;
    if (!state.onGround && withinRailZ && nearRailX && nearRailY && Math.abs(state.velocityZ) > 6) {
      if (!isGrinding) {
        isGrinding = true;
        grindScoreTimer = 0;
        popTrickText("GRINDING!");
      }
      rider.position.y = RAIL_Y + 0.55;
      rider.position.x += (RAIL_X - rider.position.x) * 0.2;
      state.velocityY = 0;
      grindScoreTimer += dt;
      if (grindScoreTimer >= 0.5) {
        grindScoreTimer -= 0.5;
        state.trickScore += 50;
        trickScoreEl.textContent = 'Trick score: ' + state.trickScore;
      }
    } else if (isGrinding) {
      isGrinding = false;
    }

    if (!state.onGround) {
      if (spinInput !== 0) {
        const delta = spinInput * SPIN_RATE * dt;
        body.rotation.y += delta;
        state.spinAccum += Math.abs(delta);
        if (state.spinAccum >= Math.PI * 2) {
          state.spinAccum -= Math.PI * 2;
          state.airSpins += 1;
          const pts = 100 * state.airSpins;
          state.trickScore += pts;
          trickScoreEl.textContent = 'Trick score: ' + state.trickScore;
          popTrickText((state.airSpins > 1 ? state.airSpins + "x " : "") + "360° SPIN +" + pts);
        }
      }
      body.rotation.x = Math.min(0.5, -state.velocityY * 0.03);
    } else {
      body.rotation.x *= 0.8;
      body.rotation.y *= 0.7;
    }

    if (rider.position.y <= 0) {
      rider.position.y = 0;
      state.velocityY = 0;
      if (!wasOnGround) {
        state.spinAccum = 0;
        state.airSpins = 0;
      }
      state.onGround = true;
    }
    rider.rotation.y = state.yaw;

    if (state.raceStarted && rider.position.z <= finishZ) {
      state.raceFinished = true;
      const elapsedMs = performance.now() - state.startTime;
      finishOverlay.style.display = 'block';
      finishOverlay.innerHTML = "🏁 Finished in " + (elapsedMs / 1000).toFixed(2) + "s · " + state.trickScore + " trick pts<br/><small>Submitting to global leaderboard...</small>";
      submitScore(elapsedMs, state.trickScore).then(() => {
        finishOverlay.innerHTML += "<br/><small>Refresh page to race again.</small>";
      });
    }
  }

  const camOffset = new THREE.Vector3(Math.sin(state.yaw) * 8, 4.5, Math.cos(state.yaw) * 8);
  camera.position.lerp(new THREE.Vector3(rider.position.x + camOffset.x, rider.position.y + camOffset.y, rider.position.z + camOffset.z), 0.12);
  camera.lookAt(rider.position.x, rider.position.y + 1.2, rider.position.z);

  checkpoints.forEach(cp => cp.mesh.rotation.z += dt * 1.5);
  speedEl.textContent = 'Speed: ' + Math.abs(state.velocityZ).toFixed(1);
  if (state.raceStarted && !state.raceFinished) {
    timerEl.textContent = 'Time: ' + ((performance.now() - state.startTime) / 1000).toFixed(1) + 's';
  }
}

function animate() {
  const dt = Math.min(0.05, clock.getDelta());
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
